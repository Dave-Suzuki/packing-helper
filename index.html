<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Car Trunk Box Packing Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .tab-nav {
            display: none;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 48px;
            z-index: 99;
        }

        .tab-nav button {
            flex: 1;
            padding: 0.75rem;
            background: transparent;
            border: none;
            color: #888;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-nav button.active {
            color: #4ecdc4;
            border-bottom-color: #4ecdc4;
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .controls-panel {
            width: 420px;
            min-width: 420px;
            padding: 1rem;
            background: rgba(255,255,255,0.03);
            border-right: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
        }

        .section {
            margin-bottom: 1rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.5rem;
        }

        .section-header h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #aaa;
        }

        .trunk-zones {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .zone-card {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 0.6rem;
            position: relative;
        }

        .zone-card.space-0 { border-top: 2px solid #a78bfa; }
        .zone-card.space-1 { border-top: 2px solid #4ecdc4; }
        .zone-card.space-2 { border-top: 2px solid #ffd93d; }
        .zone-card.space-3 { border-top: 2px solid #ff6b6b; }

        .zone-title {
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 0.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .zone-title.space-0 { color: #a78bfa; }
        .zone-title.space-1 { color: #4ecdc4; }
        .zone-title.space-2 { color: #ffd93d; }
        .zone-title.space-3 { color: #ff6b6b; }

        .remove-space-btn {
            padding: 0.2rem 0.5rem;
            background: rgba(255,100,100,0.2);
            border: 1px solid rgba(255,100,100,0.4);
            border-radius: 4px;
            color: #ff6b6b;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .remove-space-btn:hover {
            background: rgba(255,100,100,0.3);
        }

        .add-space-btn {
            width: 100%;
            padding: 0.6rem;
            background: rgba(78, 205, 196, 0.1);
            border: 1px dashed rgba(78, 205, 196, 0.4);
            border-radius: 6px;
            color: #4ecdc4;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-space-btn:hover:not(:disabled) {
            background: rgba(78, 205, 196, 0.2);
            border-style: solid;
        }

        .add-space-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .dim-row {
            display: flex;
            gap: 0.35rem;
        }

        .dim-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .dim-group label {
            font-size: 0.6rem;
            color: #666;
            margin-bottom: 0.1rem;
        }

        .dim-group input {
            width: 100%;
            padding: 0.5rem 0.25rem;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.95rem;
            text-align: center;
            -webkit-appearance: none;
            -moz-appearance: textfield;
        }

        .dim-group input:focus {
            outline: none;
            border-color: #4ecdc4;
        }

        .box-types-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .box-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 0.6rem;
            position: relative;
        }

        .remove-box-btn {
            width: 28px;
            height: 28px;
            padding: 0;
            background: rgba(255,100,100,0.2);
            border: 1px solid rgba(255,100,100,0.4);
            border-radius: 4px;
            color: #ff6b6b;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .remove-box-btn:hover {
            background: rgba(255,100,100,0.3);
        }

        .box-check input {
            accent-color: #4ecdc4;
            width: 18px;
            height: 18px;
        }

        .box-name {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.85rem;
            width: 60px;
            min-width: 60px;
        }

        .box-name:focus {
            outline: none;
            border-bottom: 1px solid #4ecdc4;
        }

        .box-dims {
            display: flex;
            gap: 0.3rem;
            flex: 1;
        }

        .box-dims .dim-group {
            flex: 1;
            min-width: 0;
        }

        .box-dims .dim-group input {
            padding: 0.4rem 0.2rem;
            font-size: 0.9rem;
        }

        .options-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .opt {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 0.4rem 0.6rem;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
        }

        .opt input { 
            accent-color: #4ecdc4;
            width: 16px;
            height: 16px;
        }

        .unit-sel {
            padding: 0.4rem 0.6rem;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.8rem;
        }

        .calc-btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 0.75rem;
            touch-action: manipulation;
        }

        .calc-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .calc-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            background: linear-gradient(135deg, #6a9a94 0%, #5a8077 100%);
        }

        .results-box {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 0.5rem;
        }

        .results-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #888;
        }

        .total-count {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
        }

        .stats-row {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            flex-wrap: wrap;
        }

        .stat {
            display: flex;
            gap: 0.3rem;
        }

        .stat-label { color: #888; }
        .stat-val { color: #4ecdc4; font-weight: 500; }

        .qty-section {
            background: rgba(78, 205, 196, 0.08);
            border: 1px solid rgba(78, 205, 196, 0.25);
            border-radius: 8px;
            padding: 0.75rem;
        }

        .qty-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .qty-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #4ecdc4;
        }

        .reset-btn {
            padding: 0.3rem 0.6rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            color: #888;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .qty-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .qty-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            flex-wrap: wrap;
        }

        .qty-row .info {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.85rem;
            min-width: 70px;
        }

        .qty-row .vol-info {
            font-size: 0.65rem;
            color: #666;
            min-width: 55px;
        }

        .qty-row .zones {
            font-size: 0.7rem;
            color: #888;
            flex: 1;
            min-width: 60px;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .qty-btn {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .qty-btn:active:not(:disabled) {
            background: rgba(78, 205, 196, 0.3);
            border-color: #4ecdc4;
        }

        .qty-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .qty-input {
            width: 50px;
            padding: 0.4rem;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
            text-align: center;
        }

        .remaining-row {
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px dashed rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
        }

        .remaining-row .label { color: #888; }
        .remaining-row .value { color: #ffd93d; font-weight: 600; }

        .canvas-wrap {
            flex: 1;
            min-width: 280px;
            position: relative;
            background: #1a1a2e;
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .hint {
            position: absolute;
            bottom: 0.5rem;
            left: 0.5rem;
            background: rgba(0,0,0,0.7);
            padding: 0.4rem 0.7rem;
            border-radius: 6px;
            font-size: 0.7rem;
            color: #888;
        }

        .legend {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(0,0,0,0.7);
            padding: 0.5rem 0.7rem;
            border-radius: 6px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin-bottom: 0.25rem;
            font-size: 0.75rem;
        }

        .legend-item:last-child { margin-bottom: 0; }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 1rem; }
            .tab-nav { display: flex; }
            .main-content { flex-direction: column; }
            .controls-panel { 
                width: 100%; 
                min-width: unset; 
                padding: 0.75rem; 
                border-right: none;
                overflow-y: visible;
                max-height: none;
            }
            .controls-panel.hidden { display: none; }
            .canvas-wrap { height: 50vh; min-height: 300px; }
            .canvas-wrap.hidden { display: none; }
            .canvas-wrap.fullscreen { height: calc(100vh - 96px); }
            .zone-card { padding: 0.75rem; }
            .dim-row { gap: 0.5rem; }
            .dim-group input { padding: 0.6rem 0.25rem; font-size: 1rem; }
            .box-row { flex-wrap: wrap; padding: 0.75rem; }
            .box-name { font-size: 0.9rem; width: 70px; }
            .box-dims { width: 100%; margin-top: 0.5rem; }
            .box-dims .dim-group input { padding: 0.5rem 0.25rem; font-size: 0.95rem; }
            .options-row { justify-content: space-between; }
            .calc-btn { padding: 1rem; font-size: 1rem; }
            .qty-row { padding: 0.6rem; }
            .qty-btn { width: 44px; height: 44px; font-size: 1.4rem; }
            .qty-input { width: 55px; font-size: 1.1rem; padding: 0.5rem; }
        }

        @media (max-width: 380px) {
            .controls-panel { padding: 0.5rem; }
            .box-name { width: 55px; font-size: 0.8rem; }
            .qty-row .info { min-width: 60px; font-size: 0.8rem; }
            .qty-row .vol-info { display: none; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .main-content { flex-direction: row; }
            .controls-panel { width: 50%; max-height: calc(100vh - 48px); overflow-y: auto; }
            .canvas-wrap { width: 50%; height: calc(100vh - 48px); }
            .tab-nav { display: none; }
            .controls-panel.hidden, .canvas-wrap.hidden { display: block; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🚗 Car Trunk Packing Calculator (Portable)</h1>
        </header>

        <nav class="tab-nav">
            <button class="active" onclick="showTab('controls')">Settings</button>
            <button onclick="showTab('3d')">3D View</button>
        </nav>

        <div class="main-content">
            <div class="controls-panel" id="controlsPanel">
                <div class="section">
                    <div class="section-header">
                        <span>📐</span>
                        <h3>Trunk Spaces</h3>
                    </div>
                    <div class="trunk-zones" id="trunkZones"></div>
                    <button class="add-space-btn" id="addSpaceBtn" onclick="addTrunkSpace()">+ Add Space</button>
                </div>

                <div class="section">
                    <div class="section-header">
                        <span>📦</span>
                        <h3>Box Types</h3>
                    </div>
                    <div class="box-types-list"></div>
                    <button class="add-space-btn" id="addBoxBtn" onclick="addBoxType()">+ Add Box Type</button>
                </div>

                <div class="options-row">
                    <label class="opt"><input type="checkbox" id="allowRotation" checked> Rotate</label>
                    <label class="opt"><input type="checkbox" id="showWireframe" checked> Wireframe</label>
                    <select class="unit-sel" id="unit">
                        <option value="in" selected>inches</option>
                        <option value="cm">cm</option>
                        <option value="mm">mm</option>
                    </select>
                </div>

                <button class="calc-btn" onclick="calculateOptimal()">Calculate Optimal Fit</button>

                <div class="results-box">
                    <div class="results-header">
                        <span class="results-title">Results</span>
                        <span class="total-count" id="totalBoxes">0 boxes</span>
                    </div>
                    <div class="stats-row">
                        <div class="stat">
                            <span class="stat-label">Used:</span>
                            <span class="stat-val" id="spaceUsed">0%</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Volume:</span>
                            <span class="stat-val" id="trunkVolume">0</span>
                        </div>
                    </div>
                </div>

                <div class="qty-section">
                    <div class="qty-header">
                        <span class="qty-title">Adjust Quantities</span>
                        <button class="reset-btn" onclick="resetToOptimal()">Reset</button>
                    </div>
                    <div class="qty-list" id="qtyList"></div>
                    <div class="remaining-row">
                        <span class="label">Remaining:</span>
                        <span class="value" id="remainingVolume">0</span>
                    </div>
                </div>
            </div>

            <div class="canvas-wrap" id="canvasWrap">
                <canvas id="canvas3d"></canvas>
                <div class="hint">👆 Drag to rotate • Pinch to zoom</div>
                <div class="legend" id="legend"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- Globals ---
        let scene, camera, renderer, trunkGroup, boxesGroup;
        let isDragging = false, prevMouse = { x: 0, y: 0 };
        let rotX = 0.4, rotY = -0.5, zoom = 1;

        const boxColors = [0xff6b6b, 0xffd93d, 0x6bcb77, 0x4ecdc4, 0xa78bfa, 0xff9ff3, 0xfeca57, 0x48dbfb, 0xff6348, 0x1dd1a1];
        const boxColorNames = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4ecdc4', '#a78bfa', '#ff9ff3', '#feca57', '#48dbfb', '#ff6348', '#1dd1a1'];
        const spaceColors = [0xa78bfa, 0x4ecdc4, 0xffd93d, 0xff6b6b];
        const spaceColorNames = ['#a78bfa', '#4ecdc4', '#ffd93d', '#ff6b6b'];

        let trunkSpaces = [];  // Array of trunk spaces
        let boxTypeConfigs = [];  // Box type configurations
        let boxTypes = [];  // Enabled box types for calculation
        let placedBoxes = [];
        let totalTrunkVolume = 0;
        let nextBoxId = 0;

        // Unified space: one 3D grid for the trunk
        let occupied = null;  // 3D boolean array
        let totalWidth = 0;
        let totalDepth = 0;
        let maxHeight = 0;

        // Track depth boundaries for each space
        let spaceDepthBounds = [];  // [{start, end, width, height, offset}]

        let saveTimeout;
        let isCalculating = false;
        let vizUpdatePending = false;
        
        // Helper to yield control to browser
        const yieldToBrowser = () => new Promise(resolve => {
            if (window.requestIdleCallback) {
                requestIdleCallback(resolve, { timeout: 10 });
            } else {
                setTimeout(resolve, 0);
            }
        });

        // --- TRUNK SPACE MANAGEMENT ---

        function initTrunkSpaces() {
            // Start with one space
            trunkSpaces = [{
                id: 0,
                name: 'Space 1',
                w: 40,
                h: 20,
                d: 24
            }];
            renderTrunkSpaces();
        }

        function addTrunkSpace() {
            if (trunkSpaces.length >= 4) return;

            const newId = trunkSpaces.length;
            trunkSpaces.push({
                id: newId,
                name: `Space ${newId + 1}`,
                w: 40,
                h: 20,
                d: 20
            });
            renderTrunkSpaces();
            saveSettings();
            calculateOptimal();
        }

        function removeTrunkSpace(id) {
            if (trunkSpaces.length <= 1) return;

            trunkSpaces = trunkSpaces.filter(s => s.id !== id);
            // Renumber remaining spaces
            trunkSpaces.forEach((s, i) => {
                s.id = i;
                s.name = `Space ${i + 1}`;
            });
            renderTrunkSpaces();
            saveSettings();
            calculateOptimal();
        }

        function updateTrunkSpace(id, field, value) {
            const space = trunkSpaces.find(s => s.id === id);
            if (space) {
                space[field] = parseFloat(value) || 0;
                saveSettings();
            }
        }

        function renderTrunkSpaces() {
            const container = document.getElementById('trunkZones');
            const addBtn = document.getElementById('addSpaceBtn');

            container.innerHTML = trunkSpaces.map((space, index) => `
                <div class="zone-card space-${index}">
                    <div class="zone-title space-${index}">
                        <span>${space.name}</span>
                        ${trunkSpaces.length > 1 ? `<button class="remove-space-btn" onclick="removeTrunkSpace(${space.id})">Remove</button>` : ''}
                    </div>
                    <div class="dim-row">
                        <div class="dim-group">
                            <label>W</label>
                            <input type="number" id="space${space.id}W" value="${space.w}" min="1" inputmode="decimal" onchange="updateTrunkSpace(${space.id}, 'w', this.value)">
                        </div>
                        <div class="dim-group">
                            <label>H</label>
                            <input type="number" id="space${space.id}H" value="${space.h}" min="1" inputmode="decimal" onchange="updateTrunkSpace(${space.id}, 'h', this.value)">
                        </div>
                        <div class="dim-group">
                            <label>D</label>
                            <input type="number" id="space${space.id}D" value="${space.d}" min="1" inputmode="decimal" onchange="updateTrunkSpace(${space.id}, 'd', this.value)">
                        </div>
                    </div>
                </div>
            `).join('');

            // Update add button state
            addBtn.disabled = trunkSpaces.length >= 4;

            // Re-attach debounced listeners to new inputs
            document.querySelectorAll('.zone-card input').forEach(el => {
                el.addEventListener('input', debounceCalculate);
            });
        }

        // --- BOX TYPE MANAGEMENT ---

        function initBoxTypes() {
            // Start with 3 default box types
            boxTypeConfigs = [
                { id: 0, name: 'Small', w: 8, h: 6, d: 6, enabled: true },
                { id: 1, name: 'Medium', w: 12, h: 8, d: 10, enabled: true },
                { id: 2, name: 'Large', w: 16, h: 12, d: 12, enabled: true }
            ];
            nextBoxId = 3;
            renderBoxTypes();
        }

        function addBoxType() {
            if (boxTypeConfigs.length >= 10) return;  // Limit to 10 box types

            boxTypeConfigs.push({
                id: nextBoxId++,
                name: `Box ${boxTypeConfigs.length + 1}`,
                w: 10,
                h: 10,
                d: 10,
                enabled: true
            });
            renderBoxTypes();
            saveSettings();
            calculateOptimal();
        }

        function removeBoxType(id) {
            if (boxTypeConfigs.length <= 1) return;  // Keep at least 1 box type

            boxTypeConfigs = boxTypeConfigs.filter(b => b.id !== id);
            renderBoxTypes();
            saveSettings();
            calculateOptimal();
        }

        function updateBoxType(id, field, value) {
            const box = boxTypeConfigs.find(b => b.id === id);
            if (box) {
                if (field === 'enabled') {
                    box[field] = value;
                } else if (field === 'name') {
                    box[field] = value;
                } else {
                    box[field] = parseFloat(value) || 0;
                }
                saveSettings();
            }
        }

        function renderBoxTypes() {
            const container = document.querySelector('.box-types-list');

            container.innerHTML = boxTypeConfigs.map((box, index) => `
                <div class="box-row" style="border-left: 3px solid ${boxColorNames[index % boxColorNames.length]};">
                    <div class="box-check"><input type="checkbox" id="box${box.id}Enabled" ${box.enabled ? 'checked' : ''} onchange="updateBoxType(${box.id}, 'enabled', this.checked); calculateOptimal();"></div>
                    <input type="text" class="box-name" id="box${box.id}Name" value="${box.name}" onchange="updateBoxType(${box.id}, 'name', this.value)">
                    <div class="box-dims">
                        <div class="dim-group"><label>W</label><input type="number" id="box${box.id}W" value="${box.w}" min="1" inputmode="decimal" onchange="updateBoxType(${box.id}, 'w', this.value)"></div>
                        <div class="dim-group"><label>H</label><input type="number" id="box${box.id}H" value="${box.h}" min="1" inputmode="decimal" onchange="updateBoxType(${box.id}, 'h', this.value)"></div>
                        <div class="dim-group"><label>D</label><input type="number" id="box${box.id}D" value="${box.d}" min="1" inputmode="decimal" onchange="updateBoxType(${box.id}, 'd', this.value)"></div>
                    </div>
                    ${boxTypeConfigs.length > 1 ? `<button class="remove-box-btn" onclick="removeBoxType(${box.id})">×</button>` : ''}
                </div>
            `).join('');

            // Update add button state
            const addBtn = document.getElementById('addBoxBtn');
            if (addBtn) {
                addBtn.disabled = boxTypeConfigs.length >= 10;
            }

            // Re-attach debounced listeners to new inputs
            document.querySelectorAll('.box-row input[type="number"]').forEach(el => {
                el.addEventListener('input', debounceCalculate);
            });
        }

        // --- LOCAL STORAGE LOGIC (Replaces Cloud) ---

        function loadSettings() {
            try {
                const saved = localStorage.getItem('trunkSettings');
                if (saved) {
                    const data = JSON.parse(saved);
                    applySettings(data);
                }
            } catch (e) {
                console.error("Load settings error", e);
            }
        }

        function applySettings(data) {
            if (data.trunkSpaces && data.trunkSpaces.length > 0) {
                trunkSpaces = data.trunkSpaces;
                renderTrunkSpaces();
            } else if (data.trunk) {
                // Legacy support - convert old format to new
                trunkSpaces = [
                    { id: 0, name: 'Space 1', w: data.trunk.backW, h: data.trunk.backH, d: data.trunk.backD }
                ];
                if (data.trunk.frontW && data.trunk.frontD && data.trunk.frontH) {
                    trunkSpaces.push({ id: 1, name: 'Space 2', w: data.trunk.frontW, h: data.trunk.frontH, d: data.trunk.frontD });
                }
                renderTrunkSpaces();
            }
            if (data.boxTypes && data.boxTypes.length > 0) {
                boxTypeConfigs = data.boxTypes;
                // Fix any duplicate IDs
                const seenIds = new Set();
                let maxId = 0;
                boxTypeConfigs.forEach(box => {
                    if (seenIds.has(box.id)) {
                        // Duplicate ID found, assign a new one
                        box.id = maxId + 1;
                    }
                    seenIds.add(box.id);
                    maxId = Math.max(maxId, box.id);
                });
                nextBoxId = maxId + 1;
                renderBoxTypes();
            } else if (data.boxes) {
                // Legacy support - convert old format to new
                boxTypeConfigs = [];
                for (const boxId in data.boxes) {
                    const b = data.boxes[boxId];
                    boxTypeConfigs.push({
                        id: parseInt(boxId),
                        name: b.name,
                        w: b.w,
                        h: b.h,
                        d: b.d,
                        enabled: b.enabled
                    });
                }
                nextBoxId = Math.max(...boxTypeConfigs.map(b => b.id)) + 1;
                renderBoxTypes();
            }
            if (data.options) {
                document.getElementById('allowRotation').checked = data.options.rotate;
                document.getElementById('showWireframe').checked = data.options.wireframe;
                document.getElementById('unit').value = data.options.unit || 'in';
            }
            // Recalculate after applying settings
            setTimeout(calculateOptimal, 100);
        }

        function saveSettings() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                try {
                    const data = {
                        trunkSpaces: trunkSpaces.map(s => ({
                            id: s.id,
                            name: s.name,
                            w: parseFloat(document.getElementById(`space${s.id}W`)?.value) || s.w,
                            h: parseFloat(document.getElementById(`space${s.id}H`)?.value) || s.h,
                            d: parseFloat(document.getElementById(`space${s.id}D`)?.value) || s.d
                        })),
                        boxTypes: boxTypeConfigs.map(b => ({
                            id: b.id,
                            name: b.name,
                            w: b.w,
                            h: b.h,
                            d: b.d,
                            enabled: b.enabled
                        })),
                        options: {
                            rotate: document.getElementById('allowRotation').checked,
                            wireframe: document.getElementById('showWireframe').checked,
                            unit: document.getElementById('unit').value
                        }
                    };
                    
                    // Use try-catch and check quota
                    localStorage.setItem('trunkSettings', JSON.stringify(data));
                } catch(e) { 
                    // Handle quota exceeded or other errors silently
                    if (e.name === 'QuotaExceededError') {
                        console.warn("Storage quota exceeded, settings not saved");
                    } else {
                        console.error("Save error", e); 
                    }
                }
            }, 1500); // Increased delay to reduce frequency on mobile
        }

        // --- Window/UI Exports ---
        
        function showTab(tab) {
            const controls = document.getElementById('controlsPanel');
            const canvas = document.getElementById('canvasWrap');
            const buttons = document.querySelectorAll('.tab-nav button');
            buttons.forEach(b => b.classList.remove('active'));
            if (tab === 'controls') {
                controls.classList.remove('hidden');
                canvas.classList.add('hidden');
                canvas.classList.remove('fullscreen');
                buttons[0].classList.add('active');
            } else {
                controls.classList.add('hidden');
                canvas.classList.remove('hidden');
                canvas.classList.add('fullscreen');
                buttons[1].classList.add('active');
                // Ensure canvas is visible and properly sized on mobile
                setTimeout(() => {
                    onResize();
                    // Force a render when switching to 3D view
                    if (renderer && scene && camera) {
                        renderer.render(scene, camera);
                    }
                }, 100);
            }
        };

        // --- 3D & Logic ---

        function init() {
            const canvas = document.getElementById('canvas3d');
            if (!canvas) {
                console.error('Canvas element not found');
                return;
            }
            
            const wrap = canvas.parentElement;
            if (!wrap) {
                console.error('Canvas wrapper not found');
                return;
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            // Ensure we have valid dimensions
            const width = wrap.clientWidth || wrap.offsetWidth || 300;
            const height = wrap.clientHeight || wrap.offsetHeight || 300;
            
            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 2000);
            renderer = new THREE.WebGLRenderer({ 
                canvas, 
                antialias: true,
                alpha: false,
                powerPreference: "high-performance"
            });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dl = new THREE.DirectionalLight(0xffffff, 0.8);
            dl.position.set(100, 200, 150);
            scene.add(dl);

            const grid = new THREE.GridHelper(250, 25, 0x444444, 0x333333);
            grid.position.y = -0.1;
            scene.add(grid);

            trunkGroup = new THREE.Group();
            boxesGroup = new THREE.Group();
            scene.add(trunkGroup);
            scene.add(boxesGroup);

            canvas.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
            canvas.addEventListener('mousemove', onMove);
            canvas.addEventListener('mouseup', () => isDragging = false);
            canvas.addEventListener('mouseleave', () => isDragging = false);
            canvas.addEventListener('wheel', onWheel, { passive: false });
            canvas.addEventListener('touchstart', onTouchStart, { passive: false });
            canvas.addEventListener('touchmove', onTouchMove, { passive: false });
            canvas.addEventListener('touchend', onTouchEnd);

            window.addEventListener('resize', onResize);
            window.addEventListener('orientationchange', () => setTimeout(onResize, 100));

            // Initialize trunk spaces and box types first
            initTrunkSpaces();
            initBoxTypes();

            // Load settings (may override trunk spaces and box types)
            loadSettings();

            // Initial render
            renderer.render(scene, camera);

            // Start calculation and animation
            calculateOptimal();
            animate();
        }

        function onMove(e) {
            if (!isDragging) return;
            rotY += (e.clientX - prevMouse.x) * 0.01;
            rotX += (e.clientY - prevMouse.y) * 0.01;
            rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
            prevMouse = { x: e.clientX, y: e.clientY };
        }

        function onWheel(e) {
            e.preventDefault();
            zoom *= e.deltaY > 0 ? 1.1 : 0.9;
            zoom = Math.max(0.3, Math.min(3, zoom));
        }

        let lastDist = 0;
        function onTouchStart(e) {
            // Only handle if canvas is visible
            const canvas = document.getElementById('canvas3d');
            if (!canvas || canvas.offsetParent === null) return;
            
            if (e.touches.length === 1) {
                isDragging = true;
                prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                e.preventDefault(); // Prevent scrolling
            } else if (e.touches.length === 2) {
                isDragging = false;
                lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                e.preventDefault(); // Prevent pinch zoom
            }
        }

        function onTouchMove(e) {
            // Only handle if canvas is visible
            const canvas = document.getElementById('canvas3d');
            if (!canvas || canvas.offsetParent === null) return;
            
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) {
                rotY += (e.touches[0].clientX - prevMouse.x) * 0.008;
                rotX += (e.touches[0].clientY - prevMouse.y) * 0.008;
                rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
                prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                if (lastDist > 0) {
                    zoom *= lastDist / dist;
                    zoom = Math.max(0.3, Math.min(3, zoom));
                }
                lastDist = dist;
            }
        }

        function onTouchEnd() {
            isDragging = false;
            lastDist = 0;
        }

        function onResize() {
            const wrap = document.getElementById('canvasWrap');
            if (!wrap || !camera || !renderer) return;
            if (wrap.offsetWidth === 0 || wrap.offsetHeight === 0) return;
            
            camera.aspect = wrap.offsetWidth / wrap.offsetHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(wrap.offsetWidth, wrap.offsetHeight);
            
            // Force a render after resize
            if (scene) {
                renderer.render(scene, camera);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const r = 280 * zoom;
            camera.position.x = r * Math.sin(rotY) * Math.cos(rotX);
            camera.position.y = r * Math.sin(rotX) + 50;
            camera.position.z = r * Math.cos(rotY) * Math.cos(rotX);
            camera.lookAt(0, 20, 0);
            renderer.render(scene, camera);
        }

        function getOrients(w, h, d) {
            const s = new Set();
            [[w,h,d],[w,d,h],[h,w,d],[h,d,w],[d,w,h],[d,h,w]].forEach(p => s.add(p.join(',')));
            return Array.from(s).map(x => { const [a,b,c] = x.split(',').map(Number); return {w:a,h:b,d:c}; });
        }

        function getBoxTypesFromUI() {
            const boxes = [];
            boxTypeConfigs.forEach((box, index) => {
                if (box.enabled) {
                    boxes.push({
                        id: box.id,
                        name: box.name,
                        w: box.w,
                        h: box.h,
                        d: box.d,
                        color: boxColors[index % boxColors.length],
                        colorName: boxColorNames[index % boxColors.length]
                    });
                }
            });
            return boxes;
        }

        function getDims() {
            // Return array of spaces with current input values
            return trunkSpaces.map(s => ({
                id: s.id,
                name: s.name,
                w: parseFloat(document.getElementById(`space${s.id}W`)?.value) || s.w,
                h: parseFloat(document.getElementById(`space${s.id}H`)?.value) || s.h,
                d: parseFloat(document.getElementById(`space${s.id}D`)?.value) || s.d
            }));
        }

        // Get the maximum allowed height at a given Z position
        function getMaxHeightAtZ(z) {
            for (const bound of spaceDepthBounds) {
                if (z >= bound.start && z < bound.end) {
                    return bound.height;
                }
            }
            return 0;
        }

        // Initialize unified occupation grid with CENTERED logic
        function initOccupationGrid() {
            const spaces = getDims();

            // Calculate total dimensions
            totalWidth = Math.max(...spaces.map(s => s.w));
            totalDepth = spaces.reduce((sum, s) => sum + s.d, 0);
            maxHeight = Math.max(...spaces.map(s => s.h));

            // Calculate depth boundaries and offsets for each space
            spaceDepthBounds = [];
            let currentDepth = 0;
            for (const space of spaces) {
                spaceDepthBounds.push({
                    start: currentDepth,
                    end: currentDepth + space.d,
                    width: space.w,
                    height: space.h,
                    offset: Math.floor((totalWidth - space.w) / 2)
                });
                currentDepth += space.d;
            }

            // Create unified grid
            occupied = new Array(Math.ceil(totalWidth)).fill(null).map(() =>
                new Array(Math.ceil(maxHeight)).fill(null).map(() =>
                    new Array(Math.ceil(totalDepth)).fill(false)
                )
            );

            // Mark out-of-bounds areas as occupied (Center aligned)
            for (let x = 0; x < Math.ceil(totalWidth); x++) {
                for (let y = 0; y < Math.ceil(maxHeight); y++) {
                    for (let z = 0; z < Math.ceil(totalDepth); z++) {
                        let isValid = false;

                        // Check each space
                        for (const bound of spaceDepthBounds) {
                            if (z >= bound.start && z < bound.end) {
                                // Check if within this space's bounds
                                if (x >= bound.offset && x < bound.offset + bound.width && y < bound.height) {
                                    isValid = true;
                                    break;
                                }
                            }
                        }

                        if (!isValid) {
                            occupied[x][y][z] = true;
                        }
                    }
                }
            }
        }

        // Check if a box can be placed at position in unified space
        function canPlaceBox(x, y, z, w, h, d) {
            if (x < 0 || y < 0 || z < 0 || x + w > totalWidth || z + d > totalDepth) {
                return false;
            }

            const xEnd = Math.ceil(x + w);
            const yEnd = Math.ceil(y + h);
            const zEnd = Math.ceil(z + d);
            
            for (let ix = Math.floor(x); ix < xEnd; ix++) {
                for (let iy = Math.floor(y); iy < yEnd; iy++) {
                    for (let iz = Math.floor(z); iz < zEnd; iz++) {
                        if (ix >= occupied.length || iy >= occupied[0].length || iz >= occupied[0][0].length) {
                            return false;
                        }
                        if (occupied[ix][iy][iz] || iy >= getMaxHeightAtZ(iz)) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function occupySpace(x, y, z, w, h, d) {
            const xEnd = Math.ceil(x + w);
            const yEnd = Math.ceil(y + h);
            const zEnd = Math.ceil(z + d);
            
            for (let ix = Math.floor(x); ix < xEnd; ix++) {
                for (let iy = Math.floor(y); iy < yEnd; iy++) {
                    for (let iz = Math.floor(z); iz < zEnd; iz++) {
                        if (ix < occupied.length && iy < occupied[0].length && iz < occupied[0][0].length) {
                            occupied[ix][iy][iz] = true;
                        }
                    }
                }
            }
        }

        function freeSpace(x, y, z, w, h, d) {
            const xStart = Math.floor(x), xEnd = Math.ceil(x + w);
            const yStart = Math.floor(y), yEnd = Math.ceil(y + h);
            const zStart = Math.floor(z), zEnd = Math.ceil(z + d);

            for (let ix = xStart; ix < xEnd; ix++) {
                for (let iy = yStart; iy < yEnd; iy++) {
                    for (let iz = zStart; iz < zEnd; iz++) {
                        if (ix >= occupied.length || iy >= occupied[0].length || iz >= occupied[0][0].length) continue;

                        // Only free cells within valid trunk bounds
                        for (const bound of spaceDepthBounds) {
                            if (iz >= bound.start && iz < bound.end) {
                                const validXStart = bound.offset;
                                const validXEnd = bound.offset + bound.width;
                                const validH = bound.height;

                                if (ix >= validXStart && ix < validXEnd && iy < validH) {
                                    occupied[ix][iy][iz] = false;
                                }
                                break;
                            }
                        }
                    }
                }
            }
        }

        // Try to place a box with any valid orientation, prioritizing tight packing
        function tryPlaceOneBox(boxW, boxH, boxD, rotate) {
            const orientations = rotate ? getOrients(boxW, boxH, boxD) : [{w: boxW, h: boxH, d: boxD}];
            
            let bestPos = null;
            let bestOrient = null;
            let bestScore = Infinity;

            for (const o of orientations) {
                // Quick bounds check
                if (o.w > totalWidth || o.d > totalDepth) continue;
                if (o.h > maxHeight) continue;

                // Scan positions: bottom-up (y), front-to-back (z), left-to-right (x)
                for (let y = 0; y + o.h <= maxHeight; y++) {
                    for (let z = 0; z + o.d <= totalDepth; z++) {
                        for (let x = 0; x + o.w <= totalWidth; x++) {
                            if (canPlaceBox(x, y, z, o.w, o.h, o.d)) {
                                // Score: prioritize bottom (y), then front (z), then left (x)
                                const score = y * 100000 + z * 1000 + x;
                                if (score < bestScore) {
                                    bestScore = score;
                                    bestPos = { x, y, z };
                                    bestOrient = o;
                                }
                                // Found a spot at this y,z - no need to check more x
                                break;
                            }
                        }
                    }
                    // If we found something at this y level, might be good enough
                    if (bestPos && bestScore < (y + 1) * 100000) break;
                }
            }

            return bestPos && bestOrient ? { pos: bestPos, orient: bestOrient } : null;
        }

        function countCanFit(boxType, rotate) {
            const result = tryPlaceOneBox(boxType.w, boxType.h, boxType.d, rotate);
            return result ? 1 : 0;
        }

        async function calculateOptimal() {
            if (isCalculating) return;
            
            isCalculating = true;
            const calcBtn = document.querySelector('.calc-btn');
            calcBtn.textContent = 'Calculating...';
            calcBtn.disabled = true;
            
            try {
                // Allow UI to update before starting heavy computation
                await yieldToBrowser();

                const spaces = getDims();
                boxTypes = getBoxTypesFromUI();
                const rotate = document.getElementById('allowRotation').checked;

                totalTrunkVolume = spaces.reduce((sum, s) => sum + (s.w * s.h * s.d), 0);

                initOccupationGrid();
                placedBoxes = [];

                // Pack boxes, largest first
                const sortedTypes = [...boxTypes].sort((a, b) => (b.w * b.h * b.d) - (a.w * a.h * a.d));

                for (const boxType of sortedTypes) {
                    let boxCount = 0;
                    const YIELD_INTERVAL = 50; // Yield every 50 boxes
                    
                    while (boxCount < 1000) { // Safety limit
                        // Yield periodically to keep UI responsive
                        if (boxCount > 0 && boxCount % YIELD_INTERVAL === 0) {
                            await yieldToBrowser();
                        }
                        
                        const result = tryPlaceOneBox(boxType.w, boxType.h, boxType.d, rotate);
                        if (!result) break;
                        
                        const { pos, orient } = result;
                        occupySpace(pos.x, pos.y, pos.z, orient.w, orient.h, orient.d);
                        placedBoxes.push({
                            boxId: boxType.id,
                            x: pos.x, y: pos.y, z: pos.z,
                            w: orient.w, h: orient.h, d: orient.d,
                            color: boxType.color,
                            name: boxType.name
                        });
                        boxCount++;
                    }
                }

                updateUI();
                updateLegend(boxTypes);
                
                // Defer 3D rendering - ensure it happens
                requestAnimationFrame(() => {
                    updateViz();
                    // Force a render after update
                    if (renderer && scene && camera) {
                        renderer.render(scene, camera);
                    }
                });
                
                setTimeout(() => saveSettings(), 100);
            } catch (e) {
                console.error('Calculation error:', e);
            } finally {
                isCalculating = false;
                calcBtn.textContent = 'Calculate Optimal Fit';
                calcBtn.disabled = false;
            }
        }

        function getBoxCounts() {
            const counts = {};
            for (const bt of boxTypes) {
                counts[bt.id] = { total: 0 };
            }
            for (const box of placedBoxes) {
                if (counts[box.boxId]) {
                    counts[box.boxId].total++;
                }
            }
            return counts;
        }

        function getUsedVolume() {
            let vol = 0;
            for (const box of placedBoxes) {
                vol += box.w * box.h * box.d;
            }
            return vol;
        }

        function updateUI() {
            const unit = document.getElementById('unit').value;
            const counts = getBoxCounts();
            const usedVol = getUsedVolume();
            const rotate = document.getElementById('allowRotation').checked;

            let totalBoxCount = placedBoxes.length;
            const pct = totalTrunkVolume > 0 ? (usedVol / totalTrunkVolume * 100).toFixed(1) : 0;

            document.getElementById('totalBoxes').textContent = totalBoxCount + ' boxes';
            document.getElementById('spaceUsed').textContent = pct + '%';
            document.getElementById('trunkVolume').textContent = totalTrunkVolume.toLocaleString() + ' ' + unit + '³';

            let html = '';
            for (const bt of boxTypes) {
                const c = counts[bt.id] || { total: 0 };
                const vol = bt.w * bt.h * bt.d;
                const canAdd = countCanFit(bt, rotate) > 0;
                const canRemove = c.total > 0;

                html += `
                    <div class="qty-row">
                        <div class="info">
                            <span class="dot" style="background:${bt.colorName};"></span>
                            <span>${bt.name}</span>
                        </div>
                        <div class="vol-info">${vol.toLocaleString()}</div>
                        <div class="zones">count: ${c.total}</div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="removeBox(${bt.id})" ${!canRemove?'disabled':''}>−</button>
                            <span class="qty-input">${c.total}</span>
                            <button class="qty-btn" onclick="addBox(${bt.id})" ${!canAdd?'disabled':''}>+</button>
                        </div>
                    </div>
                `;
            }
            document.getElementById('qtyList').innerHTML = html;

            const remaining = totalTrunkVolume - usedVol;
            document.getElementById('remainingVolume').textContent = remaining.toLocaleString() + ' ' + unit + '³';
        }

        function addBox(boxId) {
            if (isCalculating) return; // Don't allow during calculation
            
            const bt = boxTypes.find(b => b.id === boxId);
            if (!bt) return;

            const rotate = document.getElementById('allowRotation').checked;
            const result = tryPlaceOneBox(bt.w, bt.h, bt.d, rotate);

            if (result) {
                const { pos, orient } = result;
                occupySpace(pos.x, pos.y, pos.z, orient.w, orient.h, orient.d);
                placedBoxes.push({
                    boxId: bt.id,
                    x: pos.x, y: pos.y, z: pos.z,
                    w: orient.w, h: orient.h, d: orient.d,
                    color: bt.color,
                    name: bt.name
                });
                updateUI();
                requestAnimationFrame(() => updateViz());
            }
        }

        function removeBox(boxId) {
            if (isCalculating) return; // Don't allow during calculation
            
            for (let i = placedBoxes.length - 1; i >= 0; i--) {
                if (placedBoxes[i].boxId === boxId) {
                    const box = placedBoxes[i];
                    freeSpace(box.x, box.y, box.z, box.w, box.h, box.d);
                    placedBoxes.splice(i, 1);
                    updateUI();
                    requestAnimationFrame(() => updateViz());
                    return;
                }
            }
        }

        function resetToOptimal() {
            calculateOptimal();
        }

        function updateLegend(boxes) {
            if (!boxes) boxes = boxTypes;
            let html = '';

            // Add trunk spaces to legend
            trunkSpaces.forEach((space, index) => {
                const color = spaceColorNames[index];
                html += `<div class="legend-item"><div class="legend-color" style="background:rgba(${parseInt(color.slice(1,3), 16)},${parseInt(color.slice(3,5), 16)},${parseInt(color.slice(5,7), 16)},0.3);border:2px solid ${color};"></div><span>${space.name}</span></div>`;
            });

            // Add box types to legend
            for (const b of boxes) {
                html += `<div class="legend-item"><div class="legend-color" style="background:${b.colorName};"></div><span>${b.name}</span></div>`;
            }
            document.getElementById('legend').innerHTML = html;
        }

        function clearGroups() {
            while (trunkGroup.children.length) trunkGroup.remove(trunkGroup.children[0]);
            while (boxesGroup.children.length) boxesGroup.remove(boxesGroup.children[0]);
        }

        function updateViz() {
            // Skip if calculating (but allow if pending - it will be cleared)
            if (isCalculating) return;
            
            // Clear the pending flag if it was set
            vizUpdatePending = false;
            
            clearGroups();
            const wire = document.getElementById('showWireframe').checked;
            const spaces = getDims();

            const maxDim = Math.max(totalWidth, maxHeight, totalDepth);
            if (maxDim === 0 || !scene || !renderer) return; // Safety checks
            const sc = 120 / maxDim;

            // Center offset for the entire trunk in the scene
            const centerX = -totalWidth * sc / 2;
            const centerZ = -totalDepth * sc / 2;

            // Draw Centered trunk outline
            if (wire) {
                // Draw each trunk space
                spaceDepthBounds.forEach((bound, index) => {
                    const space = spaces[index];
                    const sW = space.w * sc;
                    const sH = space.h * sc;
                    const sD = space.d * sc;
                    const geo = new THREE.BoxGeometry(sW, sH, sD);
                    const color = spaceColors[index];

                    const edge = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: color }));

                    // Position: Centered via offset
                    edge.position.set(
                        centerX + (bound.offset * sc) + sW/2,
                        sH/2,
                        centerZ + bound.start * sc + sD/2
                    );
                    trunkGroup.add(edge);

                    const fill = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.06, side: THREE.BackSide }));
                    fill.position.copy(edge.position);
                    trunkGroup.add(fill);
                });
            }

            // Draw all placed boxes
            for (const box of placedBoxes) {
                const sw = box.w * sc * 0.95;
                const sh = box.h * sc * 0.95;
                const sd = box.d * sc * 0.95;

                const geo = new THREE.BoxGeometry(sw, sh, sd);
                const mat = new THREE.MeshPhongMaterial({ color: box.color, transparent: true, opacity: 0.85 });
                const mesh = new THREE.Mesh(geo, mat);

                // Position in unified space
                // box.x is relative to totalWidth=0. 
                // centerX corresponds to totalWidth=0.
                const px = centerX + (box.x + box.w/2) * sc;
                const py = (box.y + box.h/2) * sc;
                const pz = centerZ + (box.z + box.d/2) * sc;

                mesh.position.set(px, py, pz);
                boxesGroup.add(mesh);

                const edge = new THREE.LineSegments(
                    new THREE.EdgesGeometry(geo),
                    new THREE.LineBasicMaterial({ color: 0xffffff })
                );
                edge.position.copy(mesh.position);
                boxesGroup.add(edge);
            }
            
            // Force a render after updating visualization
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        window.addEventListener('load', init);

        // Debounce for input - longer delay on mobile
        let debounceTimer = null;
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const debounceDelay = isMobile ? 1000 : 500; // Longer delay on mobile
        
        function debounceCalculate() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                calculateOptimal();
            }, debounceDelay);
        }

        // Note: box-row and zone-card inputs are attached dynamically in their render functions

        document.getElementById('allowRotation').addEventListener('change', calculateOptimal);

        document.getElementById('showWireframe').addEventListener('change', updateViz);

        document.getElementById('unit').addEventListener('change', function() {
            const unit = this.value;
            let spacePresets, boxPresets;
            if (unit === 'in') {
                spacePresets = [{ w: 40, h: 20, d: 24 }];
                boxPresets = [
                    { name: 'Small', w: 8, h: 6, d: 6 },
                    { name: 'Medium', w: 12, h: 8, d: 10 },
                    { name: 'Large', w: 16, h: 12, d: 12 }
                ];
            } else if (unit === 'cm') {
                spacePresets = [{ w: 100, h: 50, d: 60 }];
                boxPresets = [
                    { name: 'Small', w: 20, h: 15, d: 15 },
                    { name: 'Medium', w: 30, h: 20, d: 25 },
                    { name: 'Large', w: 40, h: 30, d: 30 }
                ];
            } else if (unit === 'mm') {
                spacePresets = [{ w: 1000, h: 500, d: 600 }];
                boxPresets = [
                    { name: 'Small', w: 200, h: 150, d: 150 },
                    { name: 'Medium', w: 300, h: 200, d: 250 },
                    { name: 'Large', w: 400, h: 300, d: 300 }
                ];
            }
            if (spacePresets && confirm(`Update to typical ${unit} values?`)) {
                // Update trunk spaces
                trunkSpaces = spacePresets.map((s, i) => ({
                    id: i,
                    name: `Space ${i + 1}`,
                    w: s.w,
                    h: s.h,
                    d: s.d
                }));
                renderTrunkSpaces();

                // Update box types
                boxTypeConfigs = boxPresets.map((b, i) => ({
                    id: i,
                    name: b.name,
                    w: b.w,
                    h: b.h,
                    d: b.d,
                    enabled: true
                }));
                nextBoxId = boxTypeConfigs.length;
                renderBoxTypes();
            }
            calculateOptimal();
        });
    </script>
</body>
</html>
